<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .pulse-beacon {
        animation: pulse 2.5s infinite ease-in-out;
      }
      .rotate-slow {
        transform-origin: center;
        animation: rotate 20s linear infinite;
      }
      .float-badge {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-badge-delayed {
        animation: float 4s ease-in-out infinite alternate;
        animation-delay: -2s;
      }
      .scan-line {
        animation: scan 6s linear infinite;
      }
      .shimmer {
        animation: shimmer 3s infinite linear;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes scan {
        0% { transform: translateY(-400px); opacity: 0; }
        30% { opacity: 0.4; }
        70% { opacity: 0.4; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="24" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="24" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="80" r="140" fill="#9333ea" opacity="0.22" filter="url(#glow)" class="pulse-beacon" />
  <circle cx="1000" cy="320" r="160" fill="#06b6d4" opacity="0.18" filter="url(#glow)" class="pulse-beacon" style="animation-delay: -1.25s;" />

  <!-- Tech Geometric Decorative Ring -->
  <g transform="translate(1020, 100)" opacity="0.25">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" class="rotate-slow" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="6" fill="#a855f7" />
  </g>

  <!-- Status Pill Top Left -->
  <g transform="translate(80, 55)">
    <rect width="210" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="0.5">SYSTEM ACTIVE • v1.2.1</text>
  </g>

  <!-- Twitch Glitch Icon + Brand -->
  <g transform="translate(80, 115)">
    <!-- Custom SVG Twitch TV Screen -->
    <rect width="64" height="64" rx="18" fill="url(#purpleGlow)" filter="url(#softGlow)" />
    <path d="M22 20 L42 20 L48 26 L48 42 L40 42 L37 45 L32 45 L30 42 L22 42 Z" fill="#ffffff" />
    <rect x="28" y="27" width="3" height="7" fill="#9333ea" />
    <rect x="36" y="27" width="3" height="7" fill="#9333ea" />
  </g>

  <!-- Main Headline -->
  <g transform="translate(165, 145)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Twitch Drop Miner
    </text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Headless 24/7 Automated Reward Claimer &amp; Multi-Account Engine
    </text>
  </g>

  <!-- Feature Value Proposition Badges (Floating) -->
  <g transform="translate(80, 230)">
    <!-- Badge 1: Multi-Account -->
    <g class="float-badge">
      <rect width="230" height="52" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <!-- Users Icon -->
      <g transform="translate(16, 16)" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </g>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Multi-Account</text>
      <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Parallel Mining &amp; Claims</text>
    </g>

    <!-- Badge 2: Zero-Bandwidth -->
    <g transform="translate(250, 0)" class="float-badge-delayed">
      <rect width="240" height="52" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <!-- Zap / Flash Icon -->
      <g transform="translate(16, 16)" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </g>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Zero-Bandwidth</text>
      <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Spade / GQL Telemetry (~1KB)</text>
    </g>

    <!-- Badge 3: Drag & Drop Watchlist -->
    <g transform="translate(510, 0)" class="float-badge">
      <rect width="250" height="52" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <!-- Grip List Icon -->
      <g transform="translate(16, 16)" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </g>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Drag-and-Drop</text>
      <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Interactive Priority &amp; Auto-Scroll</text>
    </g>

    <!-- Badge 4: AES-256 Security -->
    <g transform="translate(780, 0)" class="float-badge-delayed">
      <rect width="240" height="52" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <!-- Shield Lock Icon -->
      <g transform="translate(16, 16)" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </g>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">AES-256-GCM</text>
      <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Encrypted OAuth at Rest</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(80, 340)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" fill="#64748b">
      Docker • FastAPI • React 18 • TypeScript • Tailwind CSS • SQLite
    </text>
  </g>
  <g transform="translate(980, 340)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c084fc">
      github.com/MatinMHF →
    </text>
  </g>
</svg>
